services:
  # World Simulator Database
  worldsim-db:
    image: postgres:12
    container_name: mini-ups-worldsim-db
    environment:
      POSTGRES_PASSWORD: abc123
      POSTGRES_USER: postgres
      POSTGRES_DB: worldSim
    ports:
      - "25432:5432"
    volumes:
      - worldsim_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      projectnet:
        aliases:
          - mydb

  # World Simulator Service
  world-simulator:
    build:
      context: ./knowledge/world_simulator_exec/docker_deploy/
    container_name: mini-ups-world-simulator
    command: bash -c "./wait-for-it.sh mydb:5432 --strict -- ./server 12345 23456 0"
    ports:
      - "12345:12345"  # UPS port
      - "23456:23456"  # Amazon port
    depends_on:
      worldsim-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - projectnet

  # Amazon Database
  amazon-db:
    image: postgres:12-alpine3.15
    container_name: mini-ups-amazon-db
    volumes:
      - amazon_postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_PASSWORD: abc123
      POSTGRES_USER: postgres
      POSTGRES_DB: mini_amazon
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - projectnet

  # Amazon Service
  amazon-web:
    build:
      context: ./knowledge/amazon/
    container_name: mini-ups-amazon-web
    ports:
      - "8080:8080"
    volumes:
      - ./knowledge/amazon:/app
    environment:
      FLASK_APP: app
      FLASK_ENV: development
      FLASK_RUN_PORT: 8080
      DATABASE_URL: postgresql://postgres:abc123@amazon-db:5432/mini_amazon
      SECRET_KEY: dev
      WORLD_HOST: world-simulator
      WORLD_PORT: "23456"
    depends_on:
      amazon-db:
        condition: service_healthy
      world-simulator:
        condition: service_started
    restart: unless-stopped
    networks:
      - projectnet

  # UPS PostgreSQL Database
  ups-database:
    image: pgvector/pgvector:pg16
    container_name: mini-ups-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ups_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc123}
      TZ: UTC
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - projectnet

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: mini-ups-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-test123}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-test123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - projectnet

  # RabbitMQ消息队列 with STOMP support for WebSocket integration
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mini-ups-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log_levels [{connection,error},{default,error}]
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
      - "61613:61613" # STOMP port for WebSocket relay
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - projectnet

  # UPS Spring Boot Backend
  ups-backend:
    image: ${BACKEND_IMAGE:-mini-ups-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini-ups-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DATABASE_URL: jdbc:postgresql://ups-database:5432/${POSTGRES_DB:-ups_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-abc123}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-test123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_ENABLED: true
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_for_development_only}
      RAG_ENABLED: false
      rag.enabled: false
      RAG_MOCK_ENABLED: true
      rag.mock.enabled: true
      METRICS_ENABLED: false
      metrics.enabled: false
      WORLD_SIMULATOR_HOST: world-simulator
      WORLD_SIMULATOR_PORT: 12345
      AMAZON_API_URL: http://amazon-web:8080
      AMAZON_WEBHOOK_AUTH_ENABLED: false  # Disable webhook authentication for development
      NUM_TRUCKS: ${NUM_TRUCKS:-5}
      WORLD_ID: ${WORLD_ID:-}
      # RAG Mock Configuration (for demo without OpenRouter API key)
    ports:
      - "8081:8081"
    depends_on:
      ups-database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      world-simulator:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - projectnet

  # UPS React Frontend
  ups-frontend:
    image: ${FRONTEND_IMAGE:-mini-ups-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: mini-ups-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8081/api
      VITE_API_BASE_URL: http://mini-ups-backend:8081
    ports:
      - "3001:3000"
    depends_on:
      - ups-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - projectnet

  # Mini-UPS MCP Server
  mcp-server:
    image: ${MCP_IMAGE:-mini-ups-mcp-server:latest}
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mini-ups-mcp-server
    env_file:
      - mcp-server/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MCP_SERVER_NAME: mini-ups-mcp-server
      MCP_SERVER_VERSION: 1.0.0
      # OpenRouter configuration (must be provided)
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Mini-UPS-NLQ}
      OPENROUTER_MODEL_FAST: ${OPENROUTER_MODEL_FAST:-openai/gpt-4o-mini}
      OPENROUTER_MODEL_FAST_FALLBACK: ${OPENROUTER_MODEL_FAST_FALLBACK:-meta-llama/llama-3.1-8b-instruct:free}
      OPENROUTER_MODEL_STRICT: ${OPENROUTER_MODEL_STRICT:-openai/gpt-4o-mini}
      OPENROUTER_MODEL_STRICT_FALLBACK: ${OPENROUTER_MODEL_STRICT_FALLBACK:-google/gemini-1.5-flash}
      OPENROUTER_MODEL_ANSWER: ${OPENROUTER_MODEL_ANSWER:-openai/gpt-4o}
      OPENROUTER_MODEL_ANSWER_FALLBACK: ${OPENROUTER_MODEL_ANSWER_FALLBACK:-google/gemini-1.5-pro}
      # Backend configuration
      BACKEND_BASE_URL: http://ups-backend:8081
      BACKEND_API_TIMEOUT: 30000
      # Optional: Amazon service base URL for cross-service queries
      AMAZON_BASE_URL: http://amazon-web:8080
      # Authentication (set in .env file or pass via environment)
      BACKEND_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      BACKEND_API_KEY: ${MCP_API_KEY:-}
      # Logging
      LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
      LOG_FORMAT: json
      # Rate limiting (align with server config)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-30}
      RATE_LIMIT_BURST_SIZE: ${RATE_LIMIT_BURST_SIZE:-10}
      # Circuit breaker
      CIRCUIT_BREAKER_ENABLED: true
      CIRCUIT_BREAKER_THRESHOLD: 5
      CIRCUIT_BREAKER_TIMEOUT: 60000
      # Optional: disable backend wait for faster startup in development
      WAIT_FOR_BACKEND: ${MCP_WAIT_FOR_BACKEND:-true}
    depends_on:
      ups-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('MCP Server Health Check')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # MCP servers typically use stdio, but could expose port for monitoring
    # ports:
    #   - "3001:3001"
    volumes:
      - ./logs:/app/logs:rw
    networks:
      - projectnet

  # Prometheus 监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: mini-ups-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - ups-backend
    restart: unless-stopped
    networks:
      - projectnet

volumes:
  postgres_data:
  rabbitmq_data:
  worldsim_data:
  amazon_postgres_data:
  prometheus_data:

networks:
  projectnet:
    driver: bridge
