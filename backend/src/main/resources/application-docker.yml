spring:
  datasource:
    # Support both legacy format and direct DATABASE_URL format
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:upsdb}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ups_db}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:abc123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: ${DATABASE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    open-in-view: false
  
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 0
  
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: /
    connection-timeout: 10000
    requested-heartbeat: 30

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    client-id: ${KAFKA_CLIENT_ID:mini-ups-backend}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}
      linger-ms: ${KAFKA_PRODUCER_LINGER_MS:5}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:mini-ups-backend}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: ${KAFKA_CONSUMER_OFFSET_RESET:latest}
    listener:
      ack-mode: MANUAL
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:fake-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:fake-client-secret}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://accounts.google.com/o/oauth2/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

jwt:
  secret: ${JWT_SECRET:YourVeryLongSecretKeyThatShouldBeAtLeast256BitsLongForHS256Algorithm}
  expiration: 86400000

world:
  simulator:
    host: ${WORLD_HOST:host.docker.internal}
    port: ${WORLD_PORT:12345}
    connection-timeout: 60000  # Increased to 60 seconds to prevent timeout during idle periods
    default-sim-speed: 1000
    reconnection:
      enabled: true
      initial-delay: 2000  # Wait 2 seconds before first reconnection attempt
      max-delay: 60000    # Maximum delay between attempts
      multiplier: 1.5     # Gentler exponential backoff
      max-attempts: 5     # Fewer reconnection attempts to avoid spam

amazon:
  base-url: ${AMAZON_API_URL:http://host.docker.internal:8080}
  webhook:
    authentication:
      enabled: false  # Disable webhook authentication for development
  webhook-endpoints:
    truck-arrived: /api/webhooks/truck-arrived
    truck-dispatched: /api/webhooks/truck-dispatched
    shipment-delivered: /api/webhooks/shipment-delivered
    shipment-detail-request: /api/webhooks/shipment-detail-request

logging:
  level:
    com.miniups: INFO
    org.hibernate.SQL: WARN
    org.springdoc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Enable debug features in Docker
app:
  debug:
    world-simulator:
      enabled: true
      buffer-size: 5000
      retention-seconds: 300

# OpenAPI Documentation (explicit in docker profile)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    disable-swagger-default-url: true
    url: /v3/api-docs

messaging:
  rabbit:
    outbox-enabled: ${MESSAGING_RABBIT_OUTBOX_ENABLED:true}
    default-exchange: ${MESSAGING_RABBIT_DEFAULT_EXCHANGE:ups.events.topic}
  kafka:
    enabled: ${MESSAGING_KAFKA_ENABLED:false}
    outbox-enabled: ${MESSAGING_KAFKA_OUTBOX_ENABLED:false}
    topic-prefix: ${MESSAGING_KAFKA_TOPIC_PREFIX:}
    default-topic: ${MESSAGING_KAFKA_DEFAULT_TOPIC:}
    send-timeout-ms: ${MESSAGING_KAFKA_SEND_TIMEOUT_MS:5000}
    auto-create-topics: ${MESSAGING_KAFKA_AUTO_CREATE_TOPICS:true}
    topics: []

rag:
  enabled: ${RAG_ENABLED:true}
  embedding:
    provider: ${RAG_EMBEDDING_PROVIDER:openrouter}
    model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
  llm:
    provider: ${RAG_LLM_PROVIDER:openrouter}
    model: ${RAG_LLM_MODEL:openai/gpt-4o-mini}
    temperature: ${RAG_LLM_TEMPERATURE:0.2}
    max-output-tokens: ${RAG_LLM_MAX_OUTPUT_TOKENS:800}
  retrieval:
    top-k: ${RAG_RETRIEVAL_TOP_K:5}
    similarity-threshold: ${RAG_RETRIEVAL_SIMILARITY_THRESHOLD:0.7}
    semantic-weight: ${RAG_RETRIEVAL_SEMANTIC_WEIGHT:0.7}
    keyword-weight: ${RAG_RETRIEVAL_KEYWORD_WEIGHT:0.3}
  rate-limit:
    admin: ${RAG_RATE_LIMIT_ADMIN:100}
    dispatcher: ${RAG_RATE_LIMIT_DISPATCHER:50}
    driver: ${RAG_RATE_LIMIT_DRIVER:20}
  storage:
    table-name: ${RAG_STORAGE_TABLE:rag_document_chunk}
    ivf-lists: ${RAG_STORAGE_IVF_LISTS:100}
  providers:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_API_BASE_URL:https://api.openai.com/v1}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      site-url: ${OPENROUTER_SITE_URL:http://localhost}
      app-name: ${OPENROUTER_APP_NAME:Mini-UPS RAG}
  ingestion:
    enabled: ${RAG_INGESTION_ENABLED:true}
    root-paths: ${RAG_INGESTION_ROOT_PATHS:knowledge}
    chunk-size: ${RAG_INGESTION_CHUNK_SIZE:1000}
    chunk-overlap: ${RAG_INGESTION_CHUNK_OVERLAP:200}
    schedule-enabled: ${RAG_INGESTION_SCHEDULE_ENABLED:false}
    schedule-cron: ${RAG_INGESTION_SCHEDULE_CRON:0 30 2 * * *}
