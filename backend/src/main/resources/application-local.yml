# Local Development Profile
# Use with: SPRING_PROFILES_ACTIVE=local or ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring:
  application:
    name: mini-ups-local

  # Database Configuration (PostgreSQL from docker-compose.local.yml)
  datasource:
    url: jdbc:postgresql://localhost:5432/ups_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:abc123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  # Disable schema initialization (use init.sql from Docker)
  sql:
    init:
      mode: never

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: test123
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    stomp:
      port: 61613

  # Enable hot reload for development
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8081

# Logging configuration for development
logging:
  level:
    com.miniups: DEBUG
    org.springframework.security: DEBUG
    org.mybatis: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-very-long-secret-key-for-jwt-signing-should-be-at-least-256-bits-long-for-local-dev}
  expiration: 86400000

# World Simulator Configuration (disabled for local dev)
world:
  simulator:
    host: localhost
    port: 12345
    enabled: false

# Amazon Integration Configuration (disabled for local dev)
amazon:
  integration:
    base-url: http://localhost:8080
    api-key: ${AMAZON_API_KEY:dev-api-key}
    enabled: false

# Enable World Simulator debugging
app:
  debug:
    world-simulator:
      enabled: true
  rabbitmq:
    enabled: true
    test:
      enabled: false
  notifications:
    enabled: false

# RAG disabled for local development
rag:
  enabled: false

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always