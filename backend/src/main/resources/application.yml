server:
  port: 8081

spring:
  application:
    name: mini-ups-backend
  
  profiles:
    active: dev
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ups_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 0
      repositories:
        enabled: false
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:10000}
    publisher-confirm-type: correlated
    publisher-returns: true
    stomp:
      port: ${RABBITMQ_STOMP_PORT:61613}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2.0

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:mini-ups-backend}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}
      linger-ms: ${KAFKA_PRODUCER_LINGER_MS:5}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:mini-ups-backend}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: ${KAFKA_CONSUMER_OFFSET_RESET:latest}
    listener:
      ack-mode: MANUAL
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
  
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET} # REQUIRED: Must be set as environment variable (minimum 32 characters)
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# World Simulator Configuration
world:
  simulator:
    host: ${WORLD_SIMULATOR_HOST:host.docker.internal}
    port: ${WORLD_SIMULATOR_PORT:12345}
    connection-timeout: ${WORLD_SIMULATOR_CONNECTION_TIMEOUT:60000}  # Increased to 60 seconds
    default-sim-speed: ${WORLD_SIMULATOR_DEFAULT_SPEED:1000}
    reconnection:
      enabled: ${WORLD_SIMULATOR_RECONNECTION_ENABLED:true}
      initial-delay: ${WORLD_SIMULATOR_RECONNECTION_INITIAL_DELAY:2000}  # Increased to 2 seconds
      max-delay: ${WORLD_SIMULATOR_RECONNECTION_MAX_DELAY:60000}  # Increased to 60 seconds  
      multiplier: ${WORLD_SIMULATOR_RECONNECTION_MULTIPLIER:1.5}  # Reduced for gentler backoff
      max-attempts: ${WORLD_SIMULATOR_RECONNECTION_MAX_ATTEMPTS:5}  # Reduced attempts

# Amazon Integration Configuration  
amazon:
  base-url: ${AMAZON_API_BASE_URL:http://localhost:8080}
  webhook:
    secret: ${AMAZON_WEBHOOK_SECRET:default-webhook-secret-key}
    signature-header: ${AMAZON_WEBHOOK_SIGNATURE_HEADER:X-Amazon-Signature}
    authentication:
      enabled: ${AMAZON_WEBHOOK_AUTH_ENABLED:true}
  webhook-endpoints:
    truck-arrived: /api/webhooks/truck-arrived
    truck-dispatched: /api/webhooks/truck-dispatched
    shipment-delivered: /api/webhooks/shipment-delivered
    shipment-detail-request: /api/webhooks/shipment-detail-request

# HTTP Client Configuration (for external service communication)
http:
  client:
    max-total-connections: ${HTTP_CLIENT_MAX_TOTAL_CONNECTIONS:100}
    max-default-per-route: ${HTTP_CLIENT_MAX_DEFAULT_PER_ROUTE:20}
    connect-timeout-ms: ${HTTP_CLIENT_CONNECT_TIMEOUT:10000}
    socket-timeout-ms: ${HTTP_CLIENT_SOCKET_TIMEOUT:30000}

# Logging Configuration
logging:
  level:
    com.miniups: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/mini-ups.log

# Management Endpoints / Actuator / Micrometer
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: mini-ups-backend

# OpenAPI Documentation
springdoc:
  api-docs:
    # Use Springdoc default path to minimize surprises
    path: /v3/api-docs
  swagger-ui:
    # Access UI via /swagger-ui/index.html; /swagger-ui.html redirects
    path: /swagger-ui.html
    # Ensure UI loads our API spec (avoid /api-docs default or Petstore)
    disable-swagger-default-url: true
    url: /v3/api-docs
    operations-sorter: method

messaging:
  rabbit:
    outbox-enabled: ${MESSAGING_RABBIT_OUTBOX_ENABLED:true}
    default-exchange: ${MESSAGING_RABBIT_DEFAULT_EXCHANGE:ups.events.topic}
  kafka:
    enabled: ${MESSAGING_KAFKA_ENABLED:false}
    outbox-enabled: ${MESSAGING_KAFKA_OUTBOX_ENABLED:false}
    topic-prefix: ${MESSAGING_KAFKA_TOPIC_PREFIX:}
    default-topic: ${MESSAGING_KAFKA_DEFAULT_TOPIC:}
    send-timeout-ms: ${MESSAGING_KAFKA_SEND_TIMEOUT_MS:5000}
    auto-create-topics: ${MESSAGING_KAFKA_AUTO_CREATE_TOPICS:true}
    topics: []

auth:
  sms:
    code-length: ${AUTH_SMS_CODE_LENGTH:6}
    code-ttl-seconds: ${AUTH_SMS_CODE_TTL_SECONDS:300}

shortlink:
  code:
    min-length: ${SHORTLINK_CODE_MIN_LENGTH:6}
  bloom:
    redis-key: ${SHORTLINK_BLOOM_REDIS_KEY:shortlink:bloom:codes}
    bit-size: ${SHORTLINK_BLOOM_BIT_SIZE:1048576}
    hash-seeds: ${SHORTLINK_BLOOM_SEEDS:17,31,73,127,191}
  stream:
    key: ${SHORTLINK_STREAM_KEY:stream:shortlink:monitor}
    group: ${SHORTLINK_STREAM_GROUP:shortlink-monitor}
    consumer-name: ${SHORTLINK_STREAM_CONSUMER:backend-node}
    batch-size: ${SHORTLINK_STREAM_BATCH:100}
    idle-timeout: ${SHORTLINK_STREAM_IDLE:PT1M}
    poll-delay-millis: ${SHORTLINK_STREAM_POLL_MS:5000}
  sentinel:
    create-threshold-per-second: ${SHORTLINK_SENTINEL_CREATE_QPS:20}
    redirect-threshold-per-second: ${SHORTLINK_SENTINEL_REDIRECT_QPS:200}
  sharding:
    table-weights: ${SHORTLINK_SHARD_WEIGHTS:short_links_0:4,short_links_1:3,short_links_2:2,short_links_3:1}

# Rate Limiting Configuration
rate-limiting:
  enabled: ${RATE_LIMITING_ENABLED:true}
  shipment-creation:
    requests-per-minute: ${RATE_LIMITING_SHIPMENT_CREATION_RPM:10}
  general-api:
    requests-per-minute: ${RATE_LIMITING_GENERAL_API_RPM:60}

# Application-specific Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}
    error-redirect-uri: ${OAUTH2_ERROR_REDIRECT_URI:http://localhost:3000/login}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3000/login}
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:true}
    test:
      enabled: ${RABBITMQ_TEST_ENABLED:false}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}
    email:
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
    sms:
      enabled: ${SMS_NOTIFICATIONS_ENABLED:false}
    push:
      enabled: ${PUSH_NOTIFICATIONS_ENABLED:false}
  debug:
    world-simulator:
      enabled: ${DEBUG_WORLD_SIMULATOR:true}
      buffer-size: ${DEBUG_BUFFER_SIZE:5000}
      retention-seconds: ${DEBUG_RETENTION_SECONDS:300}

rag:
  enabled: ${RAG_ENABLED:true}
  embedding:
    provider: ${RAG_EMBEDDING_PROVIDER:openai}
    model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
  llm:
    provider: ${RAG_LLM_PROVIDER:openai}
    model: ${RAG_LLM_MODEL:gpt-4o-mini}
    temperature: ${RAG_LLM_TEMPERATURE:0.2}
    max-output-tokens: ${RAG_LLM_MAX_OUTPUT_TOKENS:800}
  retrieval:
    top-k: ${RAG_RETRIEVAL_TOP_K:5}
    similarity-threshold: ${RAG_RETRIEVAL_SIMILARITY_THRESHOLD:0.7}
  rate-limit:
    admin: ${RAG_RATE_LIMIT_ADMIN:100}
    dispatcher: ${RAG_RATE_LIMIT_DISPATCHER:50}
    driver: ${RAG_RATE_LIMIT_DRIVER:20}
  storage:
    table-name: ${RAG_STORAGE_TABLE:rag_document_chunk}
    ivf-lists: ${RAG_STORAGE_IVF_LISTS:100}
  providers:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_API_BASE_URL:https://api.openai.com/v1}
