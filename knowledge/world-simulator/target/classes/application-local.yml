# Local development profile configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/worldSim
    username: postgres
    password: abc123
    
  data:
    redis:
      host: localhost
      port: 6380
      
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      
logging:
  level:
    com.miniups.worldsim: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    io.netty: INFO
    
world-sim:
  network:
    flakiness: 0
    max-connections: 100
  simulation:
    tick-interval-ms: 100
    update-broadcast-interval-ms: 500
  performance:
    metrics-enabled: true