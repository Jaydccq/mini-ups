# Docker deployment profile configuration
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/worldSim
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:abc123}
    
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    
logging:
  level:
    com.miniups.worldsim: INFO
    io.netty: WARN
    
world-sim:
  network:
    flakiness: ${WORLD_SIM_FLAKINESS:0}
    max-connections: 1000
  simulation:
    tick-interval-ms: 100
    update-broadcast-interval-ms: 1000
  performance:
    metrics-enabled: true
    
server:
  port: 8082